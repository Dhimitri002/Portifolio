<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Página não encontrada</title>
  <style>
    body { 
      margin: 0; 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: #07050c; 
      color: #fff; 
      font-family: 'Inter', -apple-system, sans-serif; 
    }
    .box { 
      text-align: center; 
      padding: 48px; 
      border: 1px solid rgba(255, 42, 95, 0.3); 
      border-radius: 28px; 
      background: rgba(18, 14, 28, 0.95); 
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      max-width: 440px;
    }
    h1 {
      font-size: 3.5rem;
      margin: 0 0 10px;
      color: #ff2a5f;
    }
    p {
      color: #b0a8c6;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a.btn { 
      display: inline-block;
      background: linear-gradient(135deg, #ff2a5f, #8b5cf6); 
      color: #fff; 
      text-decoration: none; 
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>O caminho que você buscou não existe no universo do Haru, mas você pode voltar ao centro de comando:</p>
    <a href="./" class="btn">Retornar ao Início</a>
  </div>
</body>
</html>
